<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عجلة الحظ الفاخرة</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: radial-gradient(circle at center, #102a45 0%, #050d1a 100%);
            color: #fff; text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header-title { font-size: 20px; font-weight: 800; background: linear-gradient(45deg, #ffd700, #ff8c00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .close-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }

        .user-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 16px; padding: 12px 16px;
            width: 100%; max-width: 380px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .user-info { text-align: right; }
        .user-name { font-size: 15px; font-weight: bold; color: #fff; }
        .user-id { font-size: 11px; color: #7f9ebc; }
        .user-balance { font-size: 13px; color: #ffd700; font-weight: bold; margin-top: 4px; display: flex; align-items: center; gap: 6px; }

        .wheel-box {
            position: relative; width: 310px; height: 310px; margin: 10px auto;
            display: flex; align-items: center; justify-content: center;
        }
        .pointer {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            width: 32px; height: 36px; z-index: 30;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }
        .pointer::after {
            content: ''; position: absolute; top: 0; left: 0;
            width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent;
            border-top: 28px solid #ffd700;
        }

        #wheelWrapper {
            width: 100%; height: 100%; border-radius: 50%;
            border: 8px solid #1a3c5e; box-shadow: 0 0 25px rgba(0, 198, 255, 0.4), inset 0 0 15px rgba(0,0,0,0.8);
            overflow: hidden; position: relative;
        }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; }

        .spin-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 76px; height: 76px; background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
            color: #000; border: 4px solid #fff; border-radius: 50%; font-size: 18px;
            font-weight: 900; cursor: pointer; z-index: 25; box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            display: flex; align-items: center; justify-content: center;
        }
        .spin-btn:active { transform: translate(-50%, -50%) scale(0.92); }
        .spin-btn.disabled { opacity: 0.6; cursor: not-allowed; filter: grayscale(1); }

        .history-box {
            background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 12px; width: 100%; max-width: 380px; margin-top: 15px;
        }
        .history-title { font-size: 13px; font-weight: bold; color: #8da4c4; text-align: right; margin-bottom: 8px; }
        .history-list { font-size: 12px; text-align: right; }
    </style>
</head>
<body>

    <div class="header">
        <button class="close-btn" onclick="tg.close()"><i class="fas fa-times"></i> إغلاق</button>
        <div class="header-title">LAMIN VIP WHEEL</div>
        <div></div>
    </div>

    <div class="user-card">
        <div class="user-info">
            <div class="user-name" id="userName">المستخدم</div>
            <div class="user-id">ID: <span id="tgId">0</span></div>
            <div class="user-balance"><i class="fas fa-coins"></i> المحفظة: <span id="userBalance">0</span> NSP</div>
        </div>
        <div style="font-size: 28px; color: #ffd700;"><i class="fas fa-crown"></i></div>
    </div>

    <div class="wheel-box">
        <div class="pointer"></div>
        <div id="wheelWrapper">
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">إبدأ</button>
    </div>

    <div class="history-box">
        <div class="history-title">آخر الجوائز المحققة:</div>
        <div class="history-list" id="historyList">جاري استقبال النتيجة...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let userId = tg.initDataUnsafe?.user?.id || "0";
        let userName = tg.initDataUnsafe?.user?.first_name || "لاعب";
        document.getElementById('tgId').innerText = userId;
        document.getElementById('userName').innerText = userName;

        const urlParams = new URLSearchParams(window.location.search);
        const preDeterminedPrize = urlParams.get('prize') ? decodeURIComponent(urlParams.get('prize')) : null;

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const wheelWrapper = document.getElementById("wheelWrapper");
        const spinBtn = document.getElementById("spinBtn");

        let sectors = [
            { text: "1000", color: "#1a3c5e" },
            { text: "2000", color: "#0d2235" },
            { text: "3000", color: "#1a3c5e" },
            { text: "5000", color: "#b8860b" },
            { text: "حظ أوفراً", color: "#0d2235" },
            { text: "15% بونص", color: "#1a3c5e" }
        ];

        let currentRotation = 0;
        let isSpinning = false;

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const arc = (2 * Math.PI) / sectors.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            sectors.forEach((sector, i) => {
                const angle = i * arc - Math.PI / 2;
                ctx.beginPath();
                ctx.fillStyle = sector.color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc, false);
                ctx.lineTo(centerX, centerY);
                ctx.fill();

                ctx.strokeStyle = "#ffd700";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 22px Tahoma";
                ctx.fillText(sector.text, radius - 60, 8);
                ctx.restore();
            });
        }

        drawWheel();

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.classList.add("disabled");

            let winningIndex = 0;
            if (preDeterminedPrize) {
                winningIndex = sectors.findIndex(s => s.text.trim() === preDeterminedPrize.trim());
                if (winningIndex === -1) winningIndex = 0;
            }

            const winningPrize = sectors[winningIndex].text;
            const degreesPerSector = 360 / sectors.length;
            const targetAngle = 360 - (winningIndex * degreesPerSector) - (degreesPerSector / 2);
            currentRotation = currentRotation + (360 * 7 - (currentRotation % 360)) + targetAngle;

            gsap.to(wheelWrapper, {
                rotation: currentRotation,
                duration: 5,
                ease: "power4.out",
                onComplete: () => {
                    isSpinning = false;
                    
                    if (!winningPrize.includes("حظ")) {
                        confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
                        tg.showAlert(`🎉 ألف مبروك! فزت بـ (${winningPrize})\nتمت إضافة الرصيد لحسابك بالبوت بنجاح.`);
                    } else {
                        tg.showAlert("حظ أوفراً في المرة القادمة!");
                    }

                    document.getElementById('historyList').innerHTML = `✅ نتيجة اللفة الحالية: <b style="color:#ffd700;">${winningPrize}</b>`;
                }
            });
        }
    </script>
</body>
</html>
