<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RALPH</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: radial-gradient(circle at center, #0f2b46 0%, #061220 100%);
            color: #fff; text-align: center; font-family: Tahoma, sans-serif;
            margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        .header-title { font-size: 19px; font-weight: bold; color: #00ffcc; margin-bottom: 12px; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        
        .wheel-container {
            position: relative; width: 320px; height: 320px; margin: 15px auto;
            display: flex; align-items: center; justify-content: center;
        }
        .pointer {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
            border-top: 26px solid #00ffcc; z-index: 50; filter: drop-shadow(0 0 8px rgba(0,255,204,0.9));
        }
        #wheelWrapper {
            width: 300px; height: 300px; border-radius: 50%;
            border: 8px solid #00ffcc; box-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
            position: relative; background: #061220; overflow: hidden;
        }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; display: block; }

        .spin-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 76px; height: 76px; background: linear-gradient(135deg, #00ffcc 0%, #008866 100%);
            color: #030812; border: 3px solid #fff; border-radius: 50%; font-size: 17px;
            font-weight: 900; cursor: pointer; z-index: 40; box-shadow: 0 0 20px rgba(0, 255, 204, 0.9);
            display: flex; align-items: center; justify-content: center;
        }
        .spin-btn.disabled { opacity: 0.5; cursor: not-allowed; }
        .result-box { margin-top: 15px; font-size: 15px; color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-title">🎡 عجلة الحظ الفاخرة</div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div id="wheelWrapper">
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>
        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">ابدأ</button>
    </div>

    <div class="result-box" id="resultText">اضغط على زر (ابدأ) لتدوير العجلة</div>

    <script>
        let tg = window.Telegram.WebApp;
        try { tg.expand(); } catch(e) {}

        const urlParams = new URLSearchParams(window.location.search);
        const preDeterminedPrize = urlParams.get('prize') ? decodeURIComponent(urlParams.get('prize')) : null;
        const userId = urlParams.get('uid') || "0";

        // الجوائز الافتراضية الـ 7 الاحتياطية
        let sectors = [
            { text: "1000", color: "#0d243a", textColor: "#00ffcc" },
            { text: "2000", color: "#133152", textColor: "#fff" },
            { text: "3000", color: "#0d243a", textColor: "#00ffcc" },
            { text: "5000", color: "#008866", textColor: "#fff" },
            { text: "15% بونص", color: "#1b2a47", textColor: "#ffd700" },
            { text: "10% بونص", color: "#0d243a", textColor: "#00ffcc" },
            { text: "حظ أوفراً", color: "#133152", textColor: "#ff5252" }
        ];

        // استقبال الجوائز الـ 7 المعدلة من لوحة تحكم الأدمن عبر الرابط
        if (urlParams.has('prizes')) {
            let prizesParam = urlParams.get('prizes');
            if (prizesParam) {
                try {
                    let decodedPrizes = decodeURIComponent(prizesParam).split(',');
                    if (decodedPrizes.length >= 7) {
                        sectors = decodedPrizes.slice(0, 7).map((p, i) => ({
                            text: p.trim(),
                            color: i % 2 === 0 ? "#0d243a" : "#133152",
                            textColor: i === 6 ? "#ff5252" : (i === 4 ? "#ffd700" : "#00ffcc")
                        }));
                    }
                } catch(e) {}
            }
        }

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const wheelWrapper = document.getElementById("wheelWrapper");
        const spinBtn = document.getElementById("spinBtn");

        let currentRotation = 0;
        let isSpinning = false;

        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;
            const arc = (2 * Math.PI) / sectors.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            sectors.forEach((sector, i) => {
                const angle = i * arc - Math.PI / 2;
                
                ctx.beginPath();
                ctx.fillStyle = sector.color;
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc, false);
                ctx.lineTo(centerX, centerY);
                ctx.fill();

                ctx.strokeStyle = "#00ffcc";
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = sector.textColor;
                ctx.font = "bold 26px Tahoma";
                ctx.fillText(sector.text, radius - 55, 10);
                ctx.restore();
            });
        }

        window.onload = drawWheel;
        drawWheel();

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            spinBtn.classList.add("disabled");

            let winningIndex = 0;
            if (preDeterminedPrize) {
                winningIndex = sectors.findIndex(s => s.text.trim() === preDeterminedPrize.trim());
                if (winningIndex === -1) winningIndex = 0;
            } else {
                winningIndex = Math.floor(Math.random() * sectors.length);
            }

            const winningPrize = sectors[winningIndex].text;
            const degreesPerSector = 360 / sectors.length;
            const targetAngle = 360 - (winningIndex * degreesPerSector) - (degreesPerSector / 2);
            currentRotation = currentRotation + (360 * 6 - (currentRotation % 360)) + targetAngle;

            if (typeof gsap !== 'undefined') {
                gsap.to(wheelWrapper, {
                    rotation: currentRotation,
                    duration: 4,
                    ease: "power3.out",
                    onComplete: () => {
                        isSpinning = false;
                        document.getElementById('resultText').innerHTML = `✨ النتيجة: <b>${winningPrize}</b>`;
                        
                        try {
                            tg.showAlert(`🎉 مبروك! لقد فزت بـ: (${winningPrize})`);
                        } catch(e) {}

                        // إرسال البيانات حصراً للبوت عبر tg.sendData ثم إغلاق نافذة الـ WebApp
                        setTimeout(() => {
                            try {
                                tg.sendData(`${userId}|${winningPrize}`);
                            } catch(e) {
                                console.log("Send data error:", e);
                            }
                            
                            try {
                                tg.close();
                            } catch(e) {}
                        }, 1500);
                    }
                });
            }
        }
    </script>
</body>
</html>
